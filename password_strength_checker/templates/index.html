<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Password Strength Checker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <div class="container">
    <h1>🔒 Password Strength Checker</h1>
    <p class="subtitle">Type a password to see how strong it is, in real time.</p>

    <div class="input-group">
      <input type="password" id="passwordInput" placeholder="Enter your password" autocomplete="off" />
      <button id="toggleBtn" type="button">👁</button>
    </div>

    <div class="strength-bar">
      <div id="strengthFill" class="strength-fill"></div>
    </div>

    <p id="strengthLabel" class="strength-label">Start typing...</p>
    <p id="reasonText" class="reason-text"></p>

    <ul id="checklist" class="checklist">
      <li id="check-length">✗ At least 8 characters</li>
      <li id="check-uppercase">✗ At least one uppercase letter</li>
      <li id="check-lowercase">✗ At least one lowercase letter</li>
      <li id="check-digit">✗ At least one number</li>
      <li id="check-special">✗ At least one special character</li>
    </ul>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
